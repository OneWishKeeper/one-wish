<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Wish</title>

<style>
:root{
  --green:#7cff89;
  --dim:#4ca85a;
  --border:#173a1c;
  --panel:#020702;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#000;
  color:var(--green);
  font-family:"Courier New",monospace;
  display:grid;
  place-items:center;
  padding:24px;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.05;
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 3px,
      rgba(124,255,137,.18) 4px
    );
  animation:staticShift 8s steps(2,end) infinite;
}

main{
  width:min(760px,100%);
  border:1px solid var(--border);
  padding:24px;
  box-shadow:0 0 30px rgba(124,255,137,.12);
  background:var(--panel);
  position:relative;
}

h1{
  text-align:center;
  letter-spacing:.15em;
  text-shadow:0 0 12px rgba(124,255,137,.35);
}

#output{
  white-space:pre-wrap;
  line-height:1.6;
  min-height:220px;
}

#cursor{
  display:inline-block;
  width:9px;
  height:1.05em;
  margin-left:3px;
  vertical-align:-2px;
  background:var(--green);
  animation:blink .85s steps(1,end) infinite;
}

textarea{
  width:100%;
  min-height:120px;
  resize:vertical;
  background:#000;
  color:var(--green);
  border:1px solid #245d2c;
  padding:12px;
  font:inherit;
}

textarea:focus{
  outline:none;
  box-shadow:0 0 14px rgba(124,255,137,.18);
}

button{
  display:block;
  width:100%;
  margin-top:14px;
  padding:14px;
  background:transparent;
  color:var(--green);
  border:1px solid var(--green);
  font:700 16px "Courier New",monospace;
  text-align:center;
  line-height:1.4;
  cursor:pointer;
  text-shadow:0 0 7px rgba(124,255,137,.25);
}

button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}

.notice{
  font-size:12px;
  line-height:1.5;
  color:var(--dim);
}

.hidden{display:none!important}

.glitch{
  animation:glitch .18s steps(2,end) 3;
}

.flicker{
  animation:flicker .15s linear 2;
}

.rare{
  border-color:#7cff89;
  box-shadow:0 0 22px rgba(124,255,137,.25);
}

@keyframes blink{
  0%,45%{opacity:1}
  46%,100%{opacity:0}
}

@keyframes staticShift{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(2px)}
}

@keyframes glitch{
  0%{transform:translate(0)}
  33%{transform:translate(1px,-1px)}
  66%{transform:translate(-1px,1px)}
  100%{transform:translate(0)}
}

@keyframes flicker{
  0%,100%{opacity:1}
  35%{opacity:.72}
  60%{opacity:.9}
}
</style>
</head>

<body>
<main id="panel">
  <h1>ONE WISH</h1>

  <div>
    <span id="output"></span><span id="cursor"></span>
  </div>

  <section id="wishArea" class="hidden">
    <textarea
      id="wish"
      maxlength="700"
      placeholder="Write your wish here..."
    ></textarea>

    <button id="seal">SEAL MY WISH</button>

    <p class="notice">
      Submit only the words of your wish. Do not include your name,
      email, phone number, location, or other personal information.
    </p>
  </section>

  <button id="secondWishButton" class="hidden">
    ONE WISH REMAINS... IF YOU DARE
  </button>
</main>

<script>
const output = document.getElementById("output");
const cursor = document.getElementById("cursor");
const panel = document.getElementById("panel");
const wishArea = document.getElementById("wishArea");
const seal = document.getElementById("seal");
const wish = document.getElementById("wish");
const secondWishButton = document.getElementById("secondWishButton");

const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
const randomFrom = list => list[Math.floor(Math.random() * list.length)];

let wishNumber = 1;
let processing = false;

async function typeText(text, speed = 32){
  cursor.classList.remove("hidden");

  for(const character of text){
    output.textContent += character;
    await sleep(character === "\n" ? 115 : speed);
  }
}

function clearOutput(){
  output.textContent = "";
}

function subtleFlicker(){
  panel.classList.remove("flicker");
  void panel.offsetWidth;
  panel.classList.add("flicker");
}

function occasionalGlitch(chance = 0.16){
  if(Math.random() < chance){
    output.classList.remove("glitch");
    void output.offsetWidth;
    output.classList.add("glitch");
  }
}

const intro = [
  "Connection established...",
  "",
  "The Feather watches.",
  "The Hawk waits.",
  "",
  "You have been granted one wish.",
  "Choose carefully.",
  "Not every wish asks the same price."
];

/* FIRST-WISH STORY: curious, hopeful, mysterious */
const firstOpenings = [
  "Your wish has been accepted.",
  "The Feather has received your words.",
  "The Hawk has taken notice.",
  "Your wish crossed the threshold.",
  "The seal has been accepted.",
  "The Sorcerer received your wish.",
  "The ink has dried around your request.",
  "The waiting place has opened.",
  "Your words have entered the silence.",
  "The mirror has remembered your request.",
  "The Feather has begun its journey.",
  "The night has carried your wish forward.",
  "Something unseen has heard you.",
  "Your request has entered the path.",
  "The first door has opened."
];

const firstHopeful = [
  "The path before it is still forming.",
  "A small change may arrive before the answer.",
  "Watch for the first ordinary sign.",
  "What begins quietly may grow with time.",
  "The Feather now carries your intention.",
  "The answer may arrive in a shape you did not expect.",
  "Patience will reveal what haste would hide.",
  "The road has shifted, though only slightly.",
  "A door may appear where you stopped looking.",
  "The Hawk sees farther than the traveler.",
  "What you asked for has begun to move.",
  "The first step may look smaller than the wish.",
  "The silence is not empty anymore.",
  "Your choice has entered the balance.",
  "Wait for what changes without explanation."
];

const firstMystery = [
  "Do not repeat the wish aloud.",
  "The first price is rarely named.",
  "Not every answer arrives alone.",
  "The Feather remembers the hand that called it.",
  "Time has begun counting.",
  "The mirror kept more than a reflection.",
  "Something else may have heard it too.",
  "The path behind you is no longer exactly the same.",
  "The next sign will not ask permission.",
  "The silence around the wish is listening.",
  "Every gift leaves an empty place.",
  "What was offered may someday be collected.",
  "The Hawk will return when the balance shifts.",
  "Nothing crosses the threshold unchanged.",
  "The wish is no longer yours alone."
];

const firstClosings = [
  "Wait for the first sign.",
  "Time will decide what follows.",
  "The journey has already begun.",
  "The seal cannot be recalled.",
  "Walk carefully from this moment forward.",
  "What comes next will arrive in its own time.",
  "The Feather now chooses the direction.",
  "The answer has begun moving toward you.",
  "Do not chase what has already heard you.",
  "The path has closed behind the wish.",
  "The balance has been marked.",
  "The first echo has already returned.",
  "Your fate has begun to turn.",
  "The waiting is part of the answer.",
  "Nothing more is required... yet."
];

/* SECOND-WISH PROPHECY: more serious */
const secondOpenings = [
  "Your second wish has been accepted.",
  "The Feather has answered twice.",
  "The final seal has been marked.",
  "Your second request crossed the threshold.",
  "The Hawk carried your words a second time.",
  "The mirror opened once more.",
  "The last line of ink has dried.",
  "Your final wish has entered the waiting place.",
  "The second door has opened.",
  "The silence accepted another request."
];

const secondWarnings = [
  "One wish was the gift; the second was your decision.",
  "The balance has shifted farther than before.",
  "The second wish carries what the first did not.",
  "Greed and hope often speak with the same voice.",
  "The Feather has noticed that you returned.",
  "Nothing is offered twice without consequence.",
  "The path now belongs to both wishes.",
  "You asked again, and something answered.",
  "The second choice cannot be separated from the first.",
  "The cost may no longer arrive alone."
];

const secondMystery = [
  "A door may remain open after you leave.",
  "The Hawk may return from a different direction.",
  "The next reflection may not feel familiar.",
  "The silence may answer before you speak.",
  "A familiar road may seem changed.",
  "The first sign may arrive twice.",
  "What follows may begin with something ordinary.",
  "The Feather may appear where you did not leave it.",
  "The waiting place now holds two echoes.",
  "Time may collect from the wish you value most."
];

const secondClosings = [
  "There will be no third wish.",
  "The Feather will answer no more.",
  "Only the consequences remain.",
  "The asking is finished.",
  "The doorway will not appear again.",
  "What follows cannot be called back.",
  "The silence has taken control.",
  "Your part in the choosing is over.",
  "The Hawk has turned away.",
  "Now you must wait."
];

/* Natural second-wish button text */
const secondWishButtons = [
  "ONE WISH SHOULD HAVE BEEN ENOUGH... WILL YOU ASK AGAIN?",
  "THE FEATHER STILL LISTENS... BUT ONLY ONCE MORE.",
  "ONE FINAL WISH REMAINS... IF YOU DARE.",
  "WALK AWAY NOW... OR SPEAK ONE LAST WISH.",
  "THE SECOND WISH MAY COST MORE THAN THE FIRST.",
  "GREED OFTEN BEGINS WITH JUST ONE MORE.",
  "WILL YOU LEAVE SATISFIED... OR ASK AGAIN?",
  "THE HAWK HAS NOT YET DEPARTED... CHOOSE NOW.",
  "THE SILENCE OFFERS ONE FINAL CHOICE.",
  "ONE LAST WISH REMAINS... CHOOSE WISELY.",
  "THE FEATHER REMEMBERS YOUR FIRST CHOICE... WILL YOU RETURN?",
  "A SECOND WISH IS WAITING... BUT SO IS ITS PRICE.",
  "YOU HAVE ONE CHANCE TO MEND WHAT THE FIRST WISH CANNOT.",
  "ONE MORE WISH MAY FIX WHAT YOU FEAR... OR OPEN SOMETHING ELSE.",
  "THE DOOR REMAINS OPEN... BUT NOT FOR LONG.",
  "YOU MAY ASK ONCE MORE... NOTHING AFTER.",
  "THE FIRST WAS A GIFT... THE SECOND IS TEMPTATION.",
  "SOME WALK AWAY NOW... OTHERS NEVER DO.",
  "THE FEATHER HAS PAUSED FOR YOUR FINAL DECISION.",
  "ONE LAST REQUEST MAY CROSS THE THRESHOLD."
];

const greedWarnings = [
  "You were given one wish.\nYet you returned for another.\nGreed does not end well.\nMay this second wish be worth the cost.",

  "One wish was the gift.\nThe second is your choice.\nThe Feather has noticed your return.\nChoose carefully.",

  "The Feather answered you once.\nStill, you ask it to answer again.\nThe second wish may open more than you intended.",

  "One should have been enough.\nYet hope and greed brought you back together.\nSpeak your final wish carefully.",

  "Your first wish already crossed the threshold.\nStill, you remain before the door.\nThere will be no third request.",

  "The silence already heard you once.\nNow it hears your hunger as well.\nMay the final wish justify what follows.",

  "You have chosen not to walk away.\nThe balance has noticed.\nYour second wish will be your last.",

  "The first wish carried hope.\nThe second carries temptation.\nChoose which voice you are following.",

  "You returned before the Feather fell silent.\nIt will listen one final time.\nAfter this, only consequences remain.",

  "One wish changed the path.\nA second may change the traveler.\nWrite only what you are willing to carry."
];

/* Harmless ritual challenges shown only after the second wish */
const challenges = [
  "Carry three pennies with you for five hours.\nWhen the fifth hour ends, leave one penny somewhere another person may find it.",

  "Take a different way home the next time it is safe to do so.\nNotice the first thing that feels unfamiliar.",

  "Carry a black feather until tomorrow.\nDo not explain it to anyone who asks.",

  "Keep a small stone in your pocket until sunset.\nReturn it to the ground before night ends.",

  "Place three pennies near a window for one hour.\nAfterward, carry only one with you.",

  "Speak your wish to no one for three days.\nLet silence carry what words cannot.",

  "Stand beneath the open sky for one quiet minute.\nDo not ask for another sign.",

  "Write one fear on paper.\nFold it twice and keep it hidden until tomorrow.",

  "Take ten slow steps before entering your home.\nLeave the day's weight outside the door.",

  "Place a glass of water beside your bed tonight.\nIn the morning, pour it onto the earth.",

  "Carry a fallen leaf until sunset.\nRelease it before darkness settles.",

  "Choose one room to leave unlit for an hour tonight.\nLet the silence remain undisturbed.",

  "When you next hear a bell, remain still for ten seconds.\nListen to what follows.",

  "Place one penny beneath a book for five hours.\nAfterward, give the penny away or leave it to be found.",

  "Take a familiar walk in the opposite direction.\nReturn only when the path feels new.",

  "Keep one small object beside your bed tonight.\nReturn it to its proper place at sunrise.",

  "Write the word you fear losing most.\nFold the paper and do not open it for seven days.",

  "Before sleeping, name three things you are willing to protect.\nSpeak them only once.",

  "Leave one harmless token near a tree.\nDo not return to check whether it remains.",

  "Carry three pennies until nightfall.\nKeep one, give one away, and leave one behind."
];

/* Rare events */
function rareEvent(){
  const roll = Math.floor(Math.random() * 5000) + 1;

  if(roll === 1){
    return "RARE SIGN 1/5000\nThe Keeper has noticed your return.";
  }

  if(roll <= 5){
    return "RARE SIGN 1/1000\nThe Hawk has already visited the path ahead.";
  }

  if(roll <= 10){
    return "RARE SIGN 1/500\nThe Feather refused to fall.";
  }

  return "";
}

/* Simple anonymous personalization without repeating the exact wish */
function wishTheme(text){
  const lower = text.toLowerCase();

  const themes = [
    {words:["money","rich","wealth","cash","debt","rent","bill","financial"], line:"The Feather now carries a desire tied to fortune."},
    {words:["love","relationship","marriage","husband","wife","boyfriend","girlfriend"], line:"The Feather now carries a desire of the heart."},
    {words:["job","work","career","promotion","business","employment"], line:"The Feather now carries a desire tied to purpose and labor."},
    {words:["home","house","apartment","move","moving"], line:"The Feather now carries a desire for shelter and belonging."},
    {words:["health","heal","healing","sick","pain"], line:"The Feather now carries a desire for restoration."},
    {words:["family","daughter","son","mother","father","child","children"], line:"The Feather now carries a desire bound to family."},
    {words:["travel","trip","flight","journey","puerto rico"], line:"The Feather now carries a desire tied to the road ahead."},
    {words:["peace","calm","stress","fear","anxiety"], line:"The Feather now carries a desire for quiet within."},
    {words:["car","vehicle","truck"], line:"The Feather now carries a desire tied to movement and passage."},
    {words:["school","education","college","test","exam"], line:"The Feather now carries a desire for knowledge and passage."}
  ];

  for(const theme of themes){
    if(theme.words.some(word => lower.includes(word))){
      return theme.line;
    }
  }

  return randomFrom([
    "The Feather now carries the shape of your desire.",
    "Your intention has entered the waiting place.",
    "The silence has understood enough.",
    "The path has accepted what you could not leave unspoken.",
    "The Feather carries what you chose not to name twice."
  ]);
}

function makeJourneyCode(){
  const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  const words = ["HAWK","FEATHER","MIRROR","INK","DOOR","SHADOW","ECHO"];
  const a = letters[Math.floor(Math.random() * letters.length)];
  const b = String(Math.floor(Math.random() * 90) + 10);
  const c = randomFrom(words);
  return `${a}${b}-${c}`;
}

function firstWishMessage(wishText){
  return [
    randomFrom(firstOpenings),
    wishTheme(wishText),
    randomFrom(firstHopeful),
    randomFrom(firstMystery),
    randomFrom(firstClosings)
  ].join("\n");
}

function secondWishMessage(wishText){
  return [
    randomFrom(secondOpenings),
    wishTheme(wishText),
    randomFrom(secondWarnings),
    randomFrom(secondMystery),
    randomFrom(secondClosings)
  ].join("\n");
}

async function start(){
  await sleep(650);

  for(const line of intro){
    await typeText(line + "\n");
    await sleep(280);
  }

  cursor.classList.add("hidden");
  wishArea.classList.remove("hidden");
  wish.focus();
}

seal.addEventListener("click", async () => {
  if(processing) return;

  const wishText = wish.value.trim();

  if(!wishText){
    wish.placeholder = wishNumber === 1
      ? "A wish must first be written..."
      : "Your second wish must first be written...";
    wish.focus();
    return;
  }

  processing = true;
  seal.disabled = true;
  wish.disabled = true;
  wishArea.classList.add("hidden");
  secondWishButton.classList.add("hidden");

  clearOutput();
  subtleFlicker();

  await typeText("Receiving...\n", 46);
  await sleep(430);
  await typeText("Reading...\n", 46);
  await sleep(600);
  await typeText("\nThe Ink Has Dried.\n", 56);
  await sleep(750);

  occasionalGlitch(.22);

  if(wishNumber === 1){
    await typeText("\n" + firstWishMessage(wishText) + "\n", 34);
    await sleep(650);

    const rare = rareEvent();
    if(rare){
      panel.classList.add("rare");
      await typeText("\n" + rare + "\n", 42);
    }

    cursor.classList.add("hidden");
    secondWishButton.textContent = randomFrom(secondWishButtons);
    secondWishButton.disabled = false;
    secondWishButton.classList.remove("hidden");
    processing = false;
    return;
  }

  await typeText("\n" + secondWishMessage(wishText) + "\n", 34);
  await sleep(700);

  const rare = rareEvent();
  if(rare){
    panel.classList.add("rare");
    await typeText("\n" + rare + "\n", 42);
    await sleep(500);
  }

  const challenge = randomFrom(challenges);
  const journeyCode = makeJourneyCode();

  await typeText(
    "\nTHE FINAL TASK\n\n" +
    challenge +
    "\n\n" +
    "Journey Feather Code: " + journeyCode +
    "\n\n" +
    "The Feather has fallen silent.\n" +
    "There will be no third wish.\n" +
    "Hopefully you know what door you just opened.\n",
    38
  );

  cursor.classList.add("hidden");
  secondWishButton.classList.add("hidden");
  wishArea.classList.add("hidden");
  processing = false;
});

secondWishButton.addEventListener("click", async () => {
  if(processing || wishNumber !== 1) return;

  processing = true;
  wishNumber = 2;

  secondWishButton.disabled = true;
  secondWishButton.classList.add("hidden");
  clearOutput();
  subtleFlicker();

  await typeText("You have chosen to return...\n", 46);
  await sleep(550);

  await typeText("\n" + randomFrom(greedWarnings) + "\n", 38);
  await sleep(750);

  await typeText("\nOne final wish remains.\n", 44);
  await sleep(600);

  cursor.classList.add("hidden");
  wish.value = "";
  wish.disabled = false;
  wish.placeholder = "Write your second and final wish here...";
  seal.disabled = false;
  seal.textContent = "SEAL MY FINAL WISH";
  wishArea.classList.remove("hidden");
  processing = false;
  wish.focus();
});

start();
</script>
</body>
</html>
