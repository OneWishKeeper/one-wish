<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>One Wish</title>

<style>
body{
  margin:0;
  min-height:100vh;
  background:#000;
  color:#7cff89;
  font-family:"Courier New",monospace;
  display:grid;
  place-items:center;
  padding:24px;
  box-sizing:border-box;
}

main{
  width:min(760px,100%);
  border:1px solid #173a1c;
  padding:24px;
  box-shadow:0 0 30px rgba(124,255,137,.12);
  background:#020702;
  box-sizing:border-box;
}

h1{
  text-align:center;
  letter-spacing:.15em;
}

#output{
  white-space:pre-wrap;
  line-height:1.6;
  min-height:220px;
}

textarea{
  width:100%;
  min-height:120px;
  resize:vertical;
  background:#000;
  color:#7cff89;
  border:1px solid #245d2c;
  padding:12px;
  font:inherit;
  box-sizing:border-box;
}

textarea:focus{
  outline:none;
  box-shadow:0 0 14px rgba(124,255,137,.18);
}

button{
  display:block;
  width:100%;
  box-sizing:border-box;
  margin-top:14px;
  padding:14px;
  background:transparent;
  color:#7cff89;
  border:1px solid #7cff89;
  font:700 16px "Courier New",monospace;
  text-align:center;
  line-height:1.4;
  cursor:pointer;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.notice{
  font-size:12px;
  line-height:1.5;
  color:#4ca85a;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<main>

<h1>ONE WISH</h1>

<div id="output"></div>

<section id="wishArea" class="hidden">

  <textarea
    id="wish"
    maxlength="700"
    placeholder="Write your wish here..."
  ></textarea>

  <button id="seal">
    SEAL MY WISH
  </button>

  <p class="notice">
    Submit only the words of your wish. Do not include your name,
    email, phone number, location, or other personal information.
  </p>

</section>

<button id="secondWishButton" class="hidden">
  ONE WISH REMAINS... IF YOU DARE
</button>

</main>

<script>
const output = document.getElementById("output");
const wishArea = document.getElementById("wishArea");
const seal = document.getElementById("seal");
const wish = document.getElementById("wish");
const secondWishButton =
  document.getElementById("secondWishButton");

const sleep = milliseconds =>
  new Promise(resolve => setTimeout(resolve, milliseconds));

let wishNumber = 1;
let processing = false;


/* ---------------------------------
   TYPEWRITER EFFECT
--------------------------------- */

async function typeText(text, speed = 35){
  for(const character of text){
    output.textContent += character;

    await sleep(
      character === "\n"
        ? 150
        : speed
    );
  }
}


/* ---------------------------------
   RANDOM ITEM
--------------------------------- */

function randomFrom(list){
  return list[
    Math.floor(Math.random() * list.length)
  ];
}


/* ---------------------------------
   INTRODUCTION
--------------------------------- */

const intro = [
  "Connection established...",
  "",
  "The Feather watches.",
  "The Hawk waits.",
  "",
  "You have been granted one wish.",
  "Choose carefully.",
  "Not every wish asks the same price."
];


/* ---------------------------------
   RANDOM WISH PROPHECIES

   20 × 20 × 20 × 20 =
   160,000 possible combinations
--------------------------------- */

const openings = [
  "Your wish has been heard.",
  "The Feather has accepted your words.",
  "The Hawk opened its eyes.",
  "The mirror remembered your face.",
  "The ink has dried.",
  "Your wish crossed the threshold.",
  "The Sorcerer received your wish.",
  "Something moved behind the silence.",
  "The seal has been accepted.",
  "The darkness noticed your request.",
  "The Feather stopped falling.",
  "The Hawk changed its path.",
  "The mirror refused to look away.",
  "Your words entered the waiting place.",
  "The night carried your wish farther than expected.",
  "An old door opened without making a sound.",
  "The room became colder after your wish was sealed.",
  "Something beneath the silence began to listen.",
  "The last echo returned with another voice.",
  "Your wish reached a place that does not forget."
];

const warnings = [
  "Something else heard it too.",
  "You were not the only one listening.",
  "The path behind you has already changed.",
  "Do not speak the wish again.",
  "The first price is always hidden.",
  "The silence around you is no longer empty.",
  "Something has begun to follow the sound of your words.",
  "The mirror kept more than your reflection.",
  "The Hawk is no longer watching from the sky.",
  "Time has started counting.",
  "Do not turn around when the room becomes quiet.",
  "The next shadow may not belong to you.",
  "Someone has already walked the path ahead.",
  "The Feather remembers every hand that touches it.",
  "The waiting is part of the cost.",
  "The oldest debts are collected without warning.",
  "Not every answer arrives alone.",
  "The darkness now knows what you asked for.",
  "The first sign may look completely ordinary.",
  "Something has been awakened by your request."
];

const hauntings = [
  "Footsteps may stop when you stop.",
  "A reflection may move after you look away.",
  "The sound at the window may not be the wind.",
  "A shadow may stand where no one is standing.",
  "You may hear your wish spoken in an empty room.",
  "The Hawk may appear where no sky can be seen.",
  "The mirror may show a room that is not yours.",
  "The Feather may return even after it is thrown away.",
  "A door may open in a place where no door existed.",
  "You may wake to find the room listening.",
  "The silence may answer before you speak.",
  "A familiar voice may call from somewhere impossible.",
  "The lights may dim when your wish is mentioned.",
  "Something may breathe on the other side of the wall.",
  "The footsteps behind you may continue after you stop.",
  "The mirror may remember a face you have never worn.",
  "The Hawk may circle above a place you have not visited yet.",
  "The Feather may fall upward when the debt comes due.",
  "Your shadow may arrive before you do.",
  "The room may become quiet because something entered it."
];

const endings = [
  "There is no turning back.",
  "Time will collect what is owed.",
  "What was given must eventually be taken.",
  "The cost will reveal itself when it is ready.",
  "The Hawk will return when the debt is due.",
  "Nothing crosses the threshold unchanged.",
  "Do not search for what is now searching for you.",
  "The wish is no longer yours.",
  "The path has already closed behind you.",
  "The seal cannot be undone.",
  "The mirror never forgets those who ask.",
  "The Feather chooses only once.",
  "The waiting has already begun.",
  "The next sign will not ask permission.",
  "The debt has been marked.",
  "Not every wish ends when it is granted.",
  "The darkness will decide what remains.",
  "Some doors close only after something enters.",
  "The oldest promises are paid in silence.",
  "Your fate has already begun to move."
];

function createWishMessage(){
  return (
    randomFrom(openings) + "\n" +
    randomFrom(warnings) + "\n" +
    randomFrom(hauntings) + "\n" +
    randomFrom(endings)
  );
}


/* ---------------------------------
   SECOND-WISH BUTTON PHRASES

   12 × 12 × 10 =
   1,440 possible button sentences
--------------------------------- */

const offerBeginnings = [
  "The Feather still listens",
  "The door remains open",
  "The silence offers another choice",
  "The Hawk has not yet departed",
  "One final whisper remains",
  "The path has not completely closed",
  "The mirror waits for your answer",
  "The seal allows one final request",
  "The darkness has left you a choice",
  "The Feather has paused",
  "Fate has offered one last opening",
  "The threshold waits"
];

const offerMiddles = [
  "one wish remains",
  "one final wish may still be spoken",
  "a second wish is waiting",
  "you may ask once more",
  "one last choice belongs to you",
  "another wish may yet be sealed",
  "a final request may cross the threshold",
  "the second wish is yours to choose",
  "one more desire may be written",
  "a final chance has appeared",
  "your second and final wish remains",
  "one more answer may be sought"
];

const offerEndings = [
  "if you dare",
  "but choose carefully",
  "though the price may be different",
  "before the door closes",
  "but greed rarely ends well",
  "and the Feather is watching",
  "though nothing is given twice without cost",
  "before the silence changes its mind",
  "but this choice cannot be recalled",
  "and what follows will be yours"
];

function createSecondWishButtonText(){
  return (
    randomFrom(offerBeginnings) +
    "... " +
    randomFrom(offerMiddles) +
    "... " +
    randomFrom(offerEndings)
  ).toUpperCase();
}


/* ---------------------------------
   WARNINGS BEFORE SECOND WISH

   12 × 12 × 10 =
   1,440 possible warning combinations
--------------------------------- */

const greedBeginnings = [
  "You were given one wish.",
  "One wish was placed before you.",
  "The Feather answered you once.",
  "One desire was already accepted.",
  "The first wish was your gift.",
  "You already crossed the threshold once.",
  "The silence already heard your request.",
  "Your first wish has already been sealed.",
  "One answer has already been promised.",
  "The Hawk already carried your words.",
  "The mirror already received one wish.",
  "Fate already granted you one choice."
];

const greedMiddles = [
  "Yet you have returned for another.",
  "Still, you seek a second.",
  "Yet one was not enough.",
  "Still, your hand reaches toward the door.",
  "But you have chosen to ask again.",
  "Yet your hunger brought you back.",
  "Still, you remain before the Feather.",
  "But your desire has spoken twice.",
  "Yet you ask the silence for more.",
  "Still, you refuse to walk away.",
  "But another wish now waits upon your tongue.",
  "Yet curiosity has brought you back."
];

const greedEndings = [
  "Greed does not end well.",
  "May the second wish be worth its cost.",
  "A second wish carries a heavier price.",
  "Choose carefully, because this is the final one.",
  "The Feather has noticed your hunger.",
  "One was a gift; the second is your decision.",
  "Not every second chance is an act of mercy.",
  "What follows belongs to the choice you make now.",
  "The door may open farther than you intended.",
  "Speak carefully, because the balance is listening."
];

function createSecondWishWarning(){
  return (
    randomFrom(greedBeginnings) + "\n" +
    randomFrom(greedMiddles) + "\n" +
    randomFrom(greedEndings)
  );
}


/* ---------------------------------
   FINAL MESSAGES AFTER SECOND WISH

   12 × 12 × 10 =
   1,440 possible final endings
--------------------------------- */

const finalBeginnings = [
  "The Feather has fallen silent.",
  "Your second wish has crossed the threshold.",
  "The Hawk has now turned away.",
  "Two wishes have been sealed.",
  "The mirror has closed.",
  "The final wish has been accepted.",
  "The last line of ink has dried.",
  "The door has opened for the final time.",
  "The silence has received everything you offered.",
  "The Feather has given all it will give.",
  "Your final words have entered the waiting place.",
  "The second seal has been marked."
];

const finalMiddles = [
  "There are no more wishes.",
  "Nothing further will be granted.",
  "The Feather will answer no more.",
  "The path will not reopen.",
  "No third request will be heard.",
  "The balance now belongs to fate.",
  "Only the consequences remain.",
  "What follows cannot be called back.",
  "The choice now moves without you.",
  "The silence has taken control.",
  "The doorway will not appear again.",
  "Your part in the asking is finished."
];

const finalClosings = [
  "Hopefully you know what door you just opened.",
  "Some doors never close once opened.",
  "May you understand what you invited through.",
  "What comes next was permitted by your choice.",
  "The Feather has nothing more to say.",
  "Time will decide what your second wish was worth.",
  "One wish was the gift; the second was the temptation.",
  "Whatever heard you has now heard enough.",
  "The path behind you is no longer where you left it.",
  "Now you must wait for the answer."
];

function createFinalMessage(){
  return (
    randomFrom(finalBeginnings) + "\n" +
    randomFrom(finalMiddles) + "\n" +
    randomFrom(finalClosings)
  );
}


/* ---------------------------------
   START THE PAGE
--------------------------------- */

async function start(){
  await sleep(700);

  for(const line of intro){
    await typeText(line + "\n");
    await sleep(350);
  }

  wishArea.classList.remove("hidden");
  wish.focus();
}

start();


/* ---------------------------------
   SUBMIT FIRST OR SECOND WISH
--------------------------------- */

seal.addEventListener("click", async () => {
  if(processing){
    return;
  }

  const wishText = wish.value.trim();

  if(!wishText){
    wish.placeholder =
      wishNumber === 1
        ? "A wish must first be written..."
        : "Your second wish must first be written...";

    wish.focus();
    return;
  }

  processing = true;

  seal.disabled = true;
  wish.disabled = true;

  wishArea.classList.add("hidden");
  secondWishButton.classList.add("hidden");

  output.textContent = "";

  await typeText("Receiving...\n", 50);
  await sleep(500);

  await typeText("Reading...\n", 50);
  await sleep(700);

  await typeText("\nThe Ink Has Dried.\n", 60);
  await sleep(900);

  const prophecy = createWishMessage();

  await typeText("\n" + prophecy + "\n", 40);
  await sleep(900);

  if(wishNumber === 1){
    secondWishButton.textContent =
      createSecondWishButtonText();

    secondWishButton.classList.remove("hidden");

    processing = false;
    return;
  }

  await sleep(700);

  const finalMessage = createFinalMessage();

  await typeText(
    "\n" +
    "The second wish has been sealed.\n\n" +
    finalMessage +
    "\n",
    45
  );

  secondWishButton.classList.add("hidden");
  wishArea.classList.add("hidden");

  processing = false;
});


/* ---------------------------------
   ACCEPT THE SECOND AND FINAL WISH
--------------------------------- */

secondWishButton.addEventListener("click", async () => {
  if(processing || wishNumber !== 1){
    return;
  }

  processing = true;
  wishNumber = 2;

  secondWishButton.disabled = true;
  secondWishButton.classList.add("hidden");

  output.textContent = "";

  await typeText("You have chosen to return...\n", 50);
  await sleep(650);

  await typeText(
    "\n" + createSecondWishWarning() + "\n",
    45
  );

  await sleep(900);

  await typeText(
    "\nOne final wish remains.\n",
    48
  );

  await sleep(700);

  wish.value = "";
  wish.disabled = false;

  wish.placeholder =
    "Write your second and final wish here...";

  seal.disabled = false;
  seal.textContent = "SEAL MY FINAL WISH";

  wishArea.classList.remove("hidden");

  processing = false;
  wish.focus();
});
</script>

</body>
</html>
