.hidden{display:none!important}

function forgePhrases(starters, middles, endings, count = 250){
  const phrases = [];

  for(const starter of starters){
    for(const middle of middles){
      for(const ending of endings){
        const phrase = `${starter} ${middle}${ending}`.replace(/\s+/g, " ").trim();

        if(!phrases.includes(phrase)){
          phrases.push(phrase);
        }

        if(phrases.length === count){
          return phrases;
        }
      }
    }
  }

  return phrases;
}

function forgeLines(firstLines, secondLines, thirdLines, count = 250){
  const phrases = [];

  for(const first of firstLines){
    for(const second of secondLines){
      for(const third of thirdLines){
        const phrase = `${first}\n${second}\n${third}`;

        if(!phrases.includes(phrase)){
          phrases.push(phrase);
        }

        if(phrases.length === count){
          return phrases;
        }
      }
    }
  }

  return phrases;
}

const MEMORY_KEY = "oneWishSeenPhrasesV2";

function loadMemory(){
  try{
    return JSON.parse(localStorage.getItem(MEMORY_KEY)) || {};
  }catch{
    return {};
  }
}

function saveMemory(memory){
  try{
    localStorage.setItem(MEMORY_KEY, JSON.stringify(memory));
  }catch{
    /* Site still works when browser storage is unavailable. */
  }
}

function randomUnseen(category, list){
  const memory = loadMemory();
  const seen = Array.isArray(memory[category]) ? memory[category] : [];

  let available = list
    .map((item, index) => ({item, index}))
    .filter(entry => !seen.includes(entry.index));

  if(available.length === 0){
    memory[category] = [];
    available = list.map((item, index) => ({item, index}));
  }

  const chosen = randomFrom(available);
  memory[category] = [...(memory[category] || []), chosen.index];
  saveMemory(memory);

  return chosen.item;
}

  if(roll === 1){
    return "RARE SIGN 1/5000\nThe Keeper has noticed your return.";

  if(roll <= 5){
    return "RARE SIGN 1/1000\nThe Hawk has already visited the path ahead.";
  }

  if(roll <= 10){
    return "RARE SIGN 1/500\nThe Feather refused to fall.";
  }

  return "";
}

    {words:["love","relationship","marriage","husband","wife","boyfriend","girlfriend"], line:"The Feather now carries a desire of the heart."},
    {words:["job","work","career","promotion","business","employment"], line:"The Feather now carries a desire tied to purpose and labor."},
    {words:["home","house","apartment","move","moving"], line:"The Feather now carries a desire for shelter and belonging."},
    {words:["health","heal","healing","sick","pain"], line:"The Feather now carries a desire for restoration."},
    {words:["family","daughter","son","mother","father","child","children"], line:"The Feather now carries a desire bound to family."},
    {words:["travel","trip","flight","journey","puerto rico"], line:"The Feather now carries a desire tied to the road ahead."},
    {words:["peace","calm","stress","fear","anxiety"], line:"The Feather now carries a desire for quiet within."},
    {words:["car","vehicle","truck"], line:"The Feather now carries a desire tied to movement and passage."},
    {words:["school","education","college","test","exam"], line:"The Feather now carries a desire for knowledge and passage."}
  ];

  for(const theme of themes){
    if(theme.words.some(word => lower.includes(word))){
      return theme.line;
    }
  }

  return randomUnseen("wishThemes", [
    "The Feather now carries the shape of your desire.",
    "Your intention has entered the waiting place.",

    "The path has accepted what you could not leave unspoken.",

}

function makeJourneyCode(){
  const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  const words = ["HAWK","FEATHER","MIRROR","INK","DOOR","SHADOW","ECHO"];
  const a = letters[Math.floor(Math.random() * letters.length)];
  const b = String(Math.floor(Math.random() * 90) + 10);
  const c = randomFrom(words);
  return `${a}${b}-${c}`;
}

  const challenge = randomUnseen("challenges", challenges);
  const journeyCode = makeJourneyCode();

  await typeText(
    "\nTHE FINAL TASK\n\n" +
    challenge +
    "\n\n" +
    "Journey Feather Code: " + journeyCode +
    "\n\n" +
    "The Feather has fallen silent.\n" +
    "There will be no third wish.\n" +
    "Hopefully you know what door you just opened.\n",
    38
  );

  cursor.classList.add("hidden");
  secondWishButton.classList.add("hidden");
  wishArea.classList.add("hidden");
  processing = false;
});

secondWishButton.addEventListener("click", async () => {
  if(processing || wishNumber !== 1) return;

  processing = true;
  wishNumber = 2;

  secondWishButton.disabled = true;
  secondWishButton.classList.add("hidden");
  clearOutput();
  subtleFlicker();

  await typeText("You have chosen to return...\n", 46);
  await sleep(550);

  await typeText("\n" + randomUnseen("greedWarnings", greedWarnings) + "\n", 38);
  await sleep(750);

  await typeText("\nOne final wish remains.\n", 44);
  await sleep(600);

  cursor.classList.add("hidden");
  wish.value = "";
  wish.disabled = false;
  wish.placeholder = "Write your second and final wish here...";
  seal.disabled = false;
  seal.textContent = "SEAL MY FINAL WISH";
  wishArea.classList.remove("hidden");
  processing = false;
  wish.focus();
});

start();
</script>
</body>
</html>
