<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>One Wish</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="terminal" aria-live="polite">
    <h1>ONE WISH</h1>

    <div id="output"></div>
    <span id="cursor" class="cursor">&nbsp;</span>

    <section id="wishArea" class="hidden">
      <textarea
        id="wish"
        maxlength="700"
        placeholder="Write your wish here..."
      ></textarea>

      <button id="seal">SEAL MY WISH</button>

      <p class="notice">
        Submit only the words of your wish. Do not include your name, email,
        phone number, location, or other personal information.
      </p>
    </section>

    <section id="final" class="hidden final">
      <div class="divider"></div>

      <p>
        <strong>The journey does not end here.</strong><br>
        Those who wish to carry the Feather may seek the Sorcerer.
      </p>

      <a
        class="button"
        href="mailto:REPLACE-WITH-YOUR-EMAIL?subject=Seeking%20the%20Sorcerer"
      >
        SEEK THE SORCERER
      </a>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
