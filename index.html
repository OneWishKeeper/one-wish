<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>One Wish</title>

<style>
:root{
  --green:#7cff89;
  --green-soft:#4ca85a;
  --green-dark:#1f7a3a;
}

*{box-sizing:border-box}

html,body{
  min-height:100%;
  margin:0;
  background:#000;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  color:var(--green);
  font-family:"Courier New",monospace;
  background:
    radial-gradient(circle at 50% 35%,rgba(20,70,28,.16),transparent 42%),
    #000;
}

#page{
  position:relative;
  z-index:10;
  width:min(980px,96vw);
  min-height:100vh;
  margin:0 auto;
  padding:clamp(22px,5vw,52px) clamp(14px,4vw,40px) 180px;
}

h1{
  margin:0 0 28px;
  text-align:center;
  font-size:clamp(36px,8vw,62px);
  letter-spacing:.16em;
  text-shadow:
    0 0 4px #000,
    0 0 10px #000,
    0 0 18px rgba(124,255,137,.7),
    0 0 34px rgba(124,255,137,.28);
}

#output{
  min-height:260px;
  white-space:pre-wrap;
  line-height:1.7;
  font-size:clamp(18px,4.3vw,24px);
  font-weight:700;
  text-shadow:
    0 0 3px #000,
    0 0 8px #000,
    0 0 14px rgba(124,255,137,.42);
}

#cursor{
  display:inline-block;
  width:9px;
  height:1.05em;
  margin-left:3px;
  vertical-align:-2px;
  background:var(--green);
  box-shadow:0 0 10px rgba(124,255,137,.75);
  animation:cursorBlink .85s steps(1,end) infinite;
}

#wishArea{margin-top:18px}
#wishWrap{position:relative}

textarea{
  width:100%;
  min-height:130px;
  resize:vertical;
  padding:15px;
  color:var(--green);
  background:rgba(0,0,0,.78);
  border:1px solid rgba(124,255,137,.68);
  font:inherit;
  outline:none;
  caret-color:var(--green);
  box-shadow:
    0 0 18px rgba(124,255,137,.11),
    inset 0 0 20px rgba(0,0,0,.75);
}

textarea:focus{
  border-color:var(--green);
  box-shadow:
    0 0 18px rgba(124,255,137,.2),
    inset 0 0 20px rgba(0,0,0,.75);
}

textarea.ink-awake{animation:inkGlow .9s ease-in-out infinite alternate}
textarea.ink-dissolve{animation:inkDissolve 1.55s ease forwards}

button{
  display:block;
  width:100%;
  margin-top:14px;
  padding:15px 16px;
  color:var(--green);
  background:rgba(0,0,0,.7);
  border:1px solid var(--green);
  font:700 16px "Courier New",monospace;
  line-height:1.45;
  cursor:pointer;
  text-shadow:0 0 8px rgba(124,255,137,.45);
  box-shadow:0 0 15px rgba(124,255,137,.11);
}

button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}

.notice{
  margin:13px 0 0;
  color:var(--green-soft);
  font-size:12px;
  line-height:1.5;
}

.hidden{display:none!important}
.glitch{animation:glitch .18s steps(2,end) 3}
.flicker{animation:flicker .16s linear 2}
.rare{
  text-shadow:
    0 0 4px #000,
    0 0 14px rgba(124,255,137,.92),
    0 0 30px rgba(124,255,137,.48)!important;
}

/* ROTATING SIGIL */
#sigilLayer{
  position:fixed;
  inset:-16vmax;
  z-index:0;
  pointer-events:none;
  opacity:.5;
  filter:drop-shadow(0 0 14px rgba(31,122,58,.26));
  animation:sigilRotate 220s linear infinite;
}
#sigilLayer svg{width:100%;height:100%}

/* PARTICLES */
#particleCanvas{
  position:fixed;
  inset:0;
  z-index:2;
  width:100%;
  height:100%;
  pointer-events:none;
}

/* EYES */
#watchingEyes{
  position:fixed;
  left:50%;
  top:18%;
  z-index:5;
  width:112px;
  height:34px;
  transform:translateX(-50%);
  opacity:0;
  pointer-events:none;
  filter:drop-shadow(0 0 10px rgba(124,255,137,.8));
}
.eye{
  position:absolute;
  top:8px;
  width:26px;
  height:12px;
  border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%,#e0ffe5 0 12%,#7cff89 13% 35%,#173a1c 36% 64%,#000 65%);
  box-shadow:
    0 0 8px rgba(124,255,137,.85),
    0 0 22px rgba(124,255,137,.35);
}
.eye.left{left:18px;transform:rotate(4deg)}
.eye.right{right:18px;transform:rotate(-4deg)}
#watchingEyes.show{animation:eyesAppear 5.6s ease-in-out forwards}
#watchingEyes.blink .eye{animation:eyeBlink .22s linear 1}

/* REALISTIC RANDOM FEATHER */
#feather{
  position:fixed;
  left:50%;
  top:-230px;
  z-index:7;
  width:clamp(74px,13vw,112px);
  height:auto;
  transform:translateX(-50%) rotate(-14deg);
  opacity:0;
  pointer-events:none;
  overflow:visible;
  filter:
    drop-shadow(0 0 8px rgba(224,255,230,.85))
    drop-shadow(0 0 18px rgba(124,255,137,.7))
    drop-shadow(0 0 38px rgba(124,255,137,.28));
}

#feather .feather-body{
  fill:url(#featherGradientA);
  stroke:rgba(220,255,228,.78);
  stroke-width:1.25;
}

#feather .shaft{
  fill:none;
  stroke:url(#shaftGradient);
  stroke-width:4.4;
  stroke-linecap:round;
}

#feather .barb{
  fill:none;
  stroke:rgba(218,255,226,.72);
  stroke-width:2;
  stroke-linecap:round;
}

#feather .barb.dark{
  stroke:rgba(91,158,102,.72);
  stroke-width:1.65;
}

#feather.drift{animation:featherDrift 8.5s ease-in-out forwards}
#feather.accept{animation:featherAccept 1.8s ease-in forwards}

/* MIST */
#mist{
  position:fixed;
  left:0;
  right:0;
  bottom:-35px;
  z-index:3;
  height:220px;
  pointer-events:none;
  overflow:hidden;
}
.mistCloud{
  position:absolute;
  bottom:0;
  width:65vw;
  height:150px;
  border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(62,151,78,.2) 0,rgba(31,122,58,.12) 38%,rgba(0,0,0,0) 72%);
  filter:blur(17px);
  opacity:.55;
}
.mistCloud.one{left:-24vw;animation:mistMoveOne 28s ease-in-out infinite alternate}
.mistCloud.two{right:-20vw;animation:mistMoveTwo 34s ease-in-out infinite alternate}
.mistCloud.three{left:18vw;width:78vw;opacity:.32;animation:mistMoveThree 42s ease-in-out infinite alternate}

#mistSymbol{
  position:absolute;
  left:50%;
  bottom:58px;
  transform:translateX(-50%) scale(.75);
  color:rgba(124,255,137,.52);
  font-size:58px;
  opacity:0;
  filter:blur(1px) drop-shadow(0 0 12px rgba(124,255,137,.42));
}
#mistSymbol.show{animation:mistSymbolForm 4.8s ease-in-out forwards}

/* HAWK SHADOW */
#hawkShadow{
  position:fixed;
  top:13%;
  left:-45vw;
  z-index:6;
  width:40vw;
  min-width:280px;
  height:180px;
  opacity:0;
  pointer-events:none;
  filter:blur(8px);
}
#hawkShadow::before,
#hawkShadow::after{
  content:"";
  position:absolute;
  top:36px;
  width:55%;
  height:86px;
  background:rgba(0,0,0,.86);
  border-radius:85% 10% 85% 20%;
}
#hawkShadow::before{left:0;transform:rotate(-14deg)}
#hawkShadow::after{right:0;transform:scaleX(-1) rotate(-14deg)}
#hawkShadow .body{
  position:absolute;
  left:43%;
  top:58px;
  width:14%;
  height:92px;
  border-radius:55% 55% 40% 40%;
  background:rgba(0,0,0,.9);
}
#hawkShadow.fly{animation:hawkShadowPass 5.2s linear forwards}

/* CRACK */
#mirrorCrack{
  position:fixed;
  right:5vw;
  top:16vh;
  z-index:8;
  width:180px;
  height:240px;
  opacity:0;
  pointer-events:none;
  filter:drop-shadow(0 0 6px rgba(124,255,137,.45));
}
#mirrorCrack path{
  fill:none;
  stroke:rgba(124,255,137,.56);
  stroke-width:1.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}
#mirrorCrack.reveal{animation:crackReveal 2.3s ease forwards}

#scanlines{
  position:fixed;
  inset:0;
  z-index:50;
  pointer-events:none;
  opacity:.045;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(124,255,137,.18) 4px);
}

@keyframes cursorBlink{0%,45%{opacity:1}46%,100%{opacity:0}}
@keyframes sigilRotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes inkGlow{
  from{color:#7cff89;text-shadow:0 0 4px rgba(124,255,137,.35)}
  to{color:#d8ffde;text-shadow:0 0 6px rgba(124,255,137,.9),0 0 18px rgba(124,255,137,.4)}
}
@keyframes inkDissolve{
  0%{opacity:1;filter:blur(0);transform:translateY(0)}
  55%{opacity:.65;filter:blur(2px)}
  100%{opacity:0;filter:blur(11px);transform:translateY(-26px) scale(.985)}
}
@keyframes featherDrift{
  0%{top:-240px;opacity:0;transform:translateX(-50%) rotate(-25deg) scale(.78)}
  8%{opacity:1}
  35%{transform:translateX(-20%) rotate(19deg) scale(.94)}
  66%{transform:translateX(-80%) rotate(-12deg) scale(1)}
  100%{top:23vh;opacity:.96;transform:translateX(-50%) rotate(7deg) scale(1)}
}
@keyframes featherAccept{
  0%{opacity:.96;top:23vh;transform:translateX(-50%) rotate(7deg) scale(1)}
  42%{opacity:1;transform:translateX(-50%) rotate(-5deg) scale(1.14);filter:drop-shadow(0 0 18px #e8ffec) drop-shadow(0 0 50px rgba(124,255,137,.95))}
  100%{top:-240px;opacity:0;transform:translateX(-50%) rotate(28deg) scale(.62)}
}
@keyframes eyesAppear{0%{opacity:0}18%{opacity:.85}70%{opacity:.85}100%{opacity:0}}
@keyframes eyeBlink{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.06)}}
@keyframes mistMoveOne{from{transform:translateX(0)}to{transform:translateX(52vw) scale(1.12)}}
@keyframes mistMoveTwo{from{transform:translateX(0) scale(1.05)}to{transform:translateX(-54vw) scale(.92)}}
@keyframes mistMoveThree{from{transform:translateX(-18vw)}to{transform:translateX(20vw)}}
@keyframes mistSymbolForm{
  0%{opacity:0;filter:blur(16px);transform:translateX(-50%) scale(.55)}
  38%{opacity:.58;filter:blur(2px);transform:translateX(-50%) scale(1)}
  72%{opacity:.42}
  100%{opacity:0;filter:blur(13px);transform:translateX(-50%) scale(1.2)}
}
@keyframes hawkShadowPass{
  0%{left:-45vw;opacity:0;transform:translateY(20px) scale(.75) rotate(-2deg)}
  12%{opacity:.62}
  50%{opacity:.4}
  88%{opacity:.28}
  100%{left:115vw;opacity:0;transform:translateY(-18px) scale(1.05) rotate(3deg)}
}
@keyframes crackReveal{0%{opacity:0;transform:scale(.9)}35%{opacity:.8;transform:scale(1.02)}100%{opacity:.48;transform:scale(1)}}
@keyframes glitch{0%{transform:translate(0)}33%{transform:translate(1px,-1px)}66%{transform:translate(-1px,1px)}100%{transform:translate(0)}}
@keyframes flicker{0%,100%{opacity:1}35%{opacity:.72}60%{opacity:.9}}

@media(max-width:600px){
  #page{width:98vw;padding:16px 12px 170px}
  h1{font-size:36px}
  #output{min-height:285px;font-size:19px}
  #watchingEyes{top:12%}
  #mirrorCrack{width:130px;height:190px;right:1vw;top:12vh}
  #hawkShadow{top:18%;min-width:230px;height:140px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL="https://qchdhrxniqpwcwtxkrgz.supabase.co";
const SUPABASE_KEY="sb_publishable_lYRHZV7dGb74UBYmfPTdbg_-RTlhzeO";

const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const output=document.getElementById("output");
const cursor=document.getElementById("cursor");
const page=document.getElementById("page");
const wishArea=document.getElementById("wishArea");
const seal=document.getElementById("seal");
const wish=document.getElementById("wish");
const secondWishButton=document.getElementById("secondWishButton");

const feather=document.getElementById("feather");
const featherBody=document.getElementById("featherBody");
const featherShaft=document.getElementById("featherShaft");
const featherBarbs=document.getElementById("featherBarbs");
const featherStop1=document.getElementById("featherStop1");
const featherStop2=document.getElementById("featherStop2");
const featherStop3=document.getElementById("featherStop3");
const featherStop4=document.getElementById("featherStop4");

const watchingEyes=document.getElementById("watchingEyes");
const hawkShadow=document.getElementById("hawkShadow");
const mistSymbol=document.getElementById("mistSymbol");
const mirrorCrack=document.getElementById("mirrorCrack");

const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const randomFrom=list=>list[Math.floor(Math.random()*list.length)];

let wishNumber=1;
let processing=false;

/* RANDOM FEATHER DESIGNS */
const featherDesigns=[
  {
    body:"M91 10 C59 21 34 52 24 89 C16 120 20 149 35 174 C47 194 53 221 54 250 C68 230 80 209 91 185 C109 146 127 94 118 55 C114 35 104 18 91 10 Z",
    shaft:"M52 302 C59 242 69 190 82 137 C91 101 99 66 105 35",
    scaleX:1,
    colors:["#effff2","#b4ffc0","#4d9b5d","#071108"]
  },
  {
    body:"M82 8 C51 24 27 59 22 99 C18 133 27 161 43 181 C55 197 61 220 61 248 C73 230 83 211 92 191 C108 155 123 111 119 71 C116 40 101 16 82 8 Z",
    shaft:"M57 304 C62 252 70 207 80 165 C89 126 97 86 102 42",
    scaleX:.9,
    colors:["#ffffff","#c8ffd0","#5faa6d","#061007"]
  },
  {
    body:"M96 13 C67 16 43 38 29 72 C17 102 16 131 29 158 C40 181 48 211 49 246 C64 227 78 204 91 176 C111 134 130 82 116 43 C111 28 104 17 96 13 Z",
    shaft:"M48 306 C56 246 66 192 79 141 C89 100 98 66 105 35",
    scaleX:1.08,
    colors:["#eaffee","#9fffb1","#3e8c4f","#030b04"]
  },
  {
    body:"M86 12 C56 28 37 57 30 91 C23 123 28 151 41 173 C52 192 57 220 56 249 C69 230 80 208 89 186 C105 149 119 102 115 66 C112 40 101 18 86 12 Z",
    shaft:"M54 304 C60 246 68 199 79 153 C87 118 94 83 99 46",
    scaleX:.82,
    colors:["#f4fff6","#d5ffda","#6db77a","#081209"]
  }
];

let lastFeatherIndex=-1;

function chooseNewFeather(){
  let index=Math.floor(Math.random()*featherDesigns.length);

  if(featherDesigns.length>1){
    while(index===lastFeatherIndex){
      index=Math.floor(Math.random()*featherDesigns.length);
    }
  }

  lastFeatherIndex=index;
  const design=featherDesigns[index];

  featherBody.setAttribute("d",design.body);
  featherShaft.setAttribute("d",design.shaft);
  featherBarbs.setAttribute("transform",`scale(${design.scaleX} 1)`);

  featherStop1.setAttribute("stop-color",design.colors[0]);
  featherStop2.setAttribute("stop-color",design.colors[1]);
  featherStop3.setAttribute("stop-color",design.colors[2]);
  featherStop4.setAttribute("stop-color",design.colors[3]);
}

async function saveWish(wishText){
  try{
    const {error}=await supabaseClient
      .from("wishes")
      .insert({wish_text:wishText});

    if(error){
      console.error("Wish submission failed:",error);
      return false;
    }
    return true;
  }catch(error){
    console.error("Wish submission failed:",error);
    return false;
  }
}

function launchFeather(){
  chooseNewFeather();
  feather.classList.remove("accept","drift");
  void feather.offsetWidth;
  feather.classList.add("drift");
}

function acceptWishWithFeather(){
  feather.classList.remove("drift","accept");
  void feather.offsetWidth;
  feather.classList.add("accept");
}

function showWatchingEyes(){
  if(processing)return;
  watchingEyes.classList.remove("show","blink");
  void watchingEyes.offsetWidth;
  watchingEyes.classList.add("show");

  setTimeout(()=>watchingEyes.classList.add("blink"),1600);
  setTimeout(()=>watchingEyes.classList.remove("blink"),1900);
  setTimeout(()=>watchingEyes.classList.add("blink"),3300);
  setTimeout(()=>watchingEyes.classList.remove("blink"),3550);
}

function scheduleEyes(){
  setTimeout(()=>{
    showWatchingEyes();
    scheduleEyes();
  },13000+Math.random()*18000);
}

function passHawkShadow(){
  if(processing)return;
  hawkShadow.classList.remove("fly");
  void hawkShadow.offsetWidth;
  hawkShadow.classList.add("fly");
}

function scheduleHawkShadow(){
  setTimeout(()=>{
    passHawkShadow();
    scheduleHawkShadow();
  },35000+Math.random()*55000);
}

function formMistSymbol(){
  mistSymbol.textContent=randomFrom(["✦","☽","◇","ᚱ","ᛟ","𓅃"]);
  mistSymbol.classList.remove("show");
  void mistSymbol.offsetWidth;
  mistSymbol.classList.add("show");
}

function scheduleMistSymbol(){
  setTimeout(()=>{
    formMistSymbol();
    scheduleMistSymbol();
  },18000+Math.random()*28000);
}

function revealMirrorCrack(){
  mirrorCrack.classList.remove("reveal");
  void mirrorCrack.offsetWidth;
  mirrorCrack.classList.add("reveal");

async function dissolveInk(){

/* PARTICLES */
const canvas=document.getElementById("particleCanvas");
const context=canvas.getContext("2d");
let particles=[];

function resizeCanvas(){
  const ratio=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.floor(window.innerWidth*ratio);
  canvas.height=Math.floor(window.innerHeight*ratio);
  canvas.style.width=window.innerWidth+"px";
  canvas.style.height=window.innerHeight+"px";
  context.setTransform(ratio,0,0,ratio,0,0);
}

function createParticle(){
  return{
    x:Math.random()*window.innerWidth,
    y:window.innerHeight+Math.random()*80,
    radius:.6+Math.random()*1.8,
    speed:.15+Math.random()*.55,
    drift:(Math.random()-.5)*.35,
    alpha:.15+Math.random()*.55,
    pulse:Math.random()*Math.PI*2,
    targetChance:Math.random()<.08
  };
}

function resetParticle(particle){
  Object.assign(particle,createParticle());
}

function animateParticles(){
  context.clearRect(0,0,window.innerWidth,window.innerHeight);
  const box=wish.getBoundingClientRect();

  for(const particle of particles){
    particle.pulse+=.025;
    particle.y-=particle.speed;
    particle.x+=particle.drift+Math.sin(particle.pulse)*.08;

    if(
      particle.targetChance &&
      !wishArea.classList.contains("hidden") &&
      box.width>0
    ){
      const targetX=box.left+box.width/2;
      const targetY=box.top+box.height/2;
      particle.x+=(targetX-particle.x)*.0007;
      particle.y+=(targetY-particle.y)*.0003;
    }

    if(
      particle.y<-20 ||
      particle.x<-30 ||
      particle.x>window.innerWidth+30
    ){
      resetParticle(particle);
    }

    const glow=particle.alpha*(.7+.3*Math.sin(particle.pulse));
    context.beginPath();
    context.arc(particle.x,particle.y,particle.radius,0,Math.PI*2);
    context.fillStyle=`rgba(124,255,137,${glow})`;
    context.shadowBlur=8;
    context.shadowColor="rgba(124,255,137,.65)";
    context.fill();
  }

  context.shadowBlur=0;
  requestAnimationFrame(animateParticles);
}

function startParticles(){
  resizeCanvas();
  particles=Array.from(
    {length:Math.min(90,Math.max(38,Math.floor(window.innerWidth/14)))},
    createParticle
  );
  animateParticles();
}

async function typeText(text,speed=32){
  cursor.classList.remove("hidden");
  for(const character of text){
    output.textContent+=character;
    await sleep(character==="\n"?100:speed);
  }
}

function clearOutput(){output.textContent=""}

function subtleFlicker(){
  page.classList.remove("flicker");
  void page.offsetWidth;
  page.classList.add("flicker");
}

function occasionalGlitch(chance=.16){
  if(Math.random()<chance){
    output.classList.remove("glitch");
    void output.offsetWidth;
    output.classList.add("glitch");
  }
}

function shuffleList(list){
  const copy=[...list];
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}

function forgePhrases(starters,middles,endings,count=250){
  const phrases=[];
  for(const starter of starters){
    for(const middle of middles){
      for(const ending of endings){
        const phrase=`${starter} ${middle}${ending}`.replace(/\s+/g," ").trim();
        if(!phrases.includes(phrase))phrases.push(phrase);
      }
    }
  }
  return shuffleList(phrases).slice(0,count);
}

function forgeLines(firstLines,secondLines,thirdLines,count=250){
  const phrases=[];
  for(const first of firstLines){
    for(const second of secondLines){
      for(const third of thirdLines){
        const phrase=`${first}\n${second}\n${third}`;
        if(!phrases.includes(phrase))phrases.push(phrase);
      }
    }
  }
  return shuffleList(phrases).slice(0,count);
}

/* LOCAL MEMORY */
const MEMORY_KEY="oneWishSeenPhrasesV8";

function loadMemory(){
  try{return JSON.parse(localStorage.getItem(MEMORY_KEY))||{}}
  catch{return {}}
}

function saveMemory(memory){
  try{localStorage.setItem(MEMORY_KEY,JSON.stringify(memory))}
  catch{}
}

function randomUnseen(category,list){
  if(!Array.isArray(list)||list.length===0)return "";

  const memory=loadMemory();
  const seen=Array.isArray(memory[category])?memory[category]:[];

  let available=list
    .map((item,index)=>({item,index}))
    .filter(entry=>!seen.includes(entry.index));

  if(available.length===0){
    memory[category]=[];
    available=list.map((item,index)=>({item,index}));
  }

  const chosen=randomFrom(available);
  memory[category]=[...(memory[category]||[]),chosen.index];
  saveMemory(memory);
  return chosen.item;
}
