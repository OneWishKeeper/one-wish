<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>One Wish</title>

<style>
:root{
  --green:#7cff89;
  --green-soft:#4ca85a;
  --green-dark:#1f7a3a;
}

*{
  box-sizing:border-box;
}

html,
body{
  min-height:100%;
  margin:0;
  background:#000;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  color:var(--green);
  font-family:"Courier New",monospace;

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(20,70,28,.16),
      transparent 42%
    ),
    #000;
}

/* ---------- MAIN PAGE ---------- */

#page{
  position:relative;
  z-index:10;
  width:min(980px,96vw);
  min-height:100vh;
  margin:0 auto;

  padding:
    clamp(22px,5vw,52px)
    clamp(14px,4vw,40px)
    180px;
}

h1{
  margin:0 0 28px;
  text-align:center;
  font-size:clamp(36px,8vw,62px);
  letter-spacing:.16em;

  text-shadow:
    0 0 4px #000,
    0 0 10px #000,
    0 0 18px rgba(124,255,137,.7),
    0 0 34px rgba(124,255,137,.28);
}

#output{
  min-height:260px;
  white-space:pre-wrap;
  line-height:1.7;
  font-size:clamp(18px,4.3vw,24px);
  font-weight:700;

  text-shadow:
    0 0 3px #000,
    0 0 8px #000,
    0 0 14px rgba(124,255,137,.42);
}

#cursor{
  display:inline-block;
  width:9px;
  height:1.05em;
  margin-left:3px;
  vertical-align:-2px;

  background:var(--green);
  box-shadow:0 0 10px rgba(124,255,137,.75);

  animation:cursorBlink .85s steps(1,end) infinite;
}

#wishArea{
  margin-top:18px;
}

#wishWrap{
  position:relative;
}

textarea{
  width:100%;
  min-height:130px;
  resize:vertical;
  padding:15px;

  color:var(--green);
  background:rgba(0,0,0,.78);
  border:1px solid rgba(124,255,137,.68);

  font:inherit;
  outline:none;
  caret-color:var(--green);

  box-shadow:
    0 0 18px rgba(124,255,137,.11),
    inset 0 0 20px rgba(0,0,0,.75);
}

textarea:focus{
  border-color:var(--green);

  box-shadow:
    0 0 18px rgba(124,255,137,.2),
    inset 0 0 20px rgba(0,0,0,.75);
}

textarea.ink-awake{
  animation:inkGlow .9s ease-in-out infinite alternate;
}

textarea.ink-dissolve{
  animation:inkDissolve 1.55s ease forwards;
}

button{
  display:block;
  width:100%;
  margin-top:14px;
  padding:15px 16px;

  color:var(--green);
  background:rgba(0,0,0,.7);
  border:1px solid var(--green);

  font:700 16px "Courier New",monospace;
  line-height:1.45;
  cursor:pointer;

  text-shadow:
    0 0 8px rgba(124,255,137,.45);

  box-shadow:
    0 0 15px rgba(124,255,137,.11);
}

button:active{
  transform:translateY(1px);
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.notice{
  margin:13px 0 0;
  color:var(--green-soft);
  font-size:12px;
  line-height:1.5;
}

.hidden{
  display:none!important;
}

.glitch{
  animation:glitch .18s steps(2,end) 3;
}

.flicker{
  animation:flicker .16s linear 2;
}

.rare{
  text-shadow:
    0 0 4px #000,
    0 0 14px rgba(124,255,137,.92),
    0 0 30px rgba(124,255,137,.48)!important;
}

/* ---------- ROTATING SIGIL ---------- */

#sigilLayer{
  position:fixed;
  inset:-16vmax;
  z-index:0;
  pointer-events:none;
  opacity:.5;

  filter:
    drop-shadow(
      0 0 14px rgba(31,122,58,.26)
    );

  animation:sigilRotate 220s linear infinite;
}

#sigilLayer svg{
  width:100%;
  height:100%;
}

/* ---------- PARTICLES ---------- */

#particleCanvas{
  position:fixed;
  inset:0;
  z-index:2;
  width:100%;
  height:100%;
  pointer-events:none;
}

/* ---------- HAWK EYES ---------- */

#watchingEyes{
  position:fixed;
  left:50%;
  top:18%;
  z-index:5;

  width:112px;
  height:34px;

  transform:translateX(-50%);
  opacity:0;
  pointer-events:none;

  filter:
    drop-shadow(
      0 0 10px rgba(124,255,137,.8)
    );
}

.eye{
  position:absolute;
  top:8px;

  width:26px;
  height:12px;
  border-radius:50%;

  background:
    radial-gradient(
      circle at 50% 50%,
      #e0ffe5 0 12%,
      #7cff89 13% 35%,
      #173a1c 36% 64%,
      #000 65%
    );

  box-shadow:
    0 0 8px rgba(124,255,137,.85),
    0 0 22px rgba(124,255,137,.35);
}

.eye.left{
  left:18px;
  transform:rotate(4deg);
}

.eye.right{
  right:18px;
  transform:rotate(-4deg);
}

#watchingEyes.show{
  animation:eyesAppear 5.6s ease-in-out forwards;
}

#watchingEyes.blink .eye{
  animation:eyeBlink .22s linear 1;
}

/* ---------- RANDOM REAL FEATHERS ---------- */

#feather{
  position:fixed;
  left:50%;
  top:-290px;
  z-index:7;

  width:clamp(90px,18vw,145px);
  height:270px;

  transform:
    translateX(-50%)
    rotate(-14deg);

  opacity:0;
  pointer-events:none;
  overflow:visible;
}

#feather svg{
  display:block;
  width:100%;
  height:100%;
  overflow:visible;

  filter:
    drop-shadow(0 0 7px rgba(235,255,239,.85))
    drop-shadow(0 0 18px rgba(124,255,137,.65))
    drop-shadow(0 0 38px rgba(124,255,137,.28));
}

#feather .vane{
  fill:url(#activeFeatherGradient);
  stroke:rgba(225,255,232,.72);
  stroke-width:1.15;
  stroke-linejoin:round;
}

#feather .shaft{
  fill:none;
  stroke:url(#activeShaftGradient);
  stroke-width:4.2;
  stroke-linecap:round;
}

#feather .barb{
  fill:none;
  stroke:rgba(225,255,232,.68);
  stroke-width:1.7;
  stroke-linecap:round;
}

#feather .barb-dark{
  fill:none;
  stroke:rgba(81,156,94,.72);
  stroke-width:1.45;
  stroke-linecap:round;
}

#feather .marking{
  fill:none;
  stroke:rgba(25,78,34,.65);
  stroke-width:5;
  stroke-linecap:round;
  opacity:.65;
}

#feather.drift{
  animation:featherDrift 8.5s ease-in-out forwards;
}

#feather.accept{
  animation:featherAccept 1.8s ease-in forwards;
}

/* ---------- MIST ---------- */

#mist{
  position:fixed;
  left:0;
  right:0;
  bottom:-35px;
  z-index:3;

  height:220px;

  pointer-events:none;
  overflow:hidden;
}

.mistCloud{
  position:absolute;
  bottom:0;

  width:65vw;
  height:150px;
  border-radius:50%;

  background:
    radial-gradient(
      ellipse at center,
      rgba(62,151,78,.2) 0,
      rgba(31,122,58,.12) 38%,
      rgba(0,0,0,0) 72%
    );

  filter:blur(17px);
  opacity:.55;
}

.mistCloud.one{
  left:-24vw;
  animation:
    mistMoveOne 28s ease-in-out infinite alternate;
}

.mistCloud.two{
  right:-20vw;
  animation:
    mistMoveTwo 34s ease-in-out infinite alternate;
}

.mistCloud.three{
  left:18vw;
  width:78vw;
  opacity:.32;

  animation:
    mistMoveThree 42s ease-in-out infinite alternate;
}

#mistSymbol{
  position:absolute;
  left:50%;
  bottom:58px;

  transform:
    translateX(-50%)
    scale(.75);

  color:rgba(124,255,137,.52);
  font-size:58px;
  opacity:0;

  filter:
    blur(1px)
    drop-shadow(
      0 0 12px rgba(124,255,137,.42)
    );
}

#mistSymbol.show{
  animation:
    mistSymbolForm 4.8s ease-in-out forwards;
}

/* ---------- HAWK SHADOW ---------- */

#hawkShadow{
  position:fixed;
  top:13%;
  left:-45vw;
  z-index:6;

  width:40vw;
  min-width:280px;
  height:180px;

  opacity:0;
  pointer-events:none;
  filter:blur(8px);
}

#hawkShadow::before,
#hawkShadow::after{
  content:"";
  position:absolute;
  top:36px;

  width:55%;
  height:86px;

  background:rgba(0,0,0,.86);
  border-radius:85% 10% 85% 20%;
}

#hawkShadow::before{
  left:0;
  transform:rotate(-14deg);
}

#hawkShadow::after{
  right:0;
  transform:
    scaleX(-1)
    rotate(-14deg);
}

#hawkShadow .body{
  position:absolute;
  left:43%;
  top:58px;

  width:14%;
  height:92px;

  border-radius:55% 55% 40% 40%;
  background:rgba(0,0,0,.9);
}

#hawkShadow.fly{
  animation:
    hawkShadowPass 5.2s linear forwards;
}

/* ---------- MIRROR CRACK ---------- */

#mirrorCrack{
  position:fixed;
  right:5vw;
  top:16vh;
  z-index:8;

  width:180px;
  height:240px;

  opacity:0;
  pointer-events:none;

  filter:
    drop-shadow(
      0 0 6px rgba(124,255,137,.45)
    );
}

#mirrorCrack path{
  fill:none;
  stroke:rgba(124,255,137,.56);
  stroke-width:1.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#mirrorCrack.reveal{
  animation:
    crackReveal 2.3s ease forwards;
}

/* ---------- SCANLINES ---------- */

#scanlines{
  position:fixed;
  inset:0;
  z-index:50;

  pointer-events:none;
  opacity:.045;

  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 3px,
      rgba(124,255,137,.18) 4px
    );
}

/* ---------- ANIMATIONS ---------- */

@keyframes cursorBlink{
  0%,45%{
    opacity:1;
  }

  46%,100%{
    opacity:0;
  }
}

@keyframes sigilRotate{
  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }
}

@keyframes inkGlow{
  from{
    color:#7cff89;

    text-shadow:
      0 0 4px rgba(124,255,137,.35);
  }

  to{
    color:#d8ffde;

    text-shadow:
      0 0 6px rgba(124,255,137,.9),
      0 0 18px rgba(124,255,137,.4);
  }
}

@keyframes inkDissolve{
  0%{
    opacity:1;
    filter:blur(0);
    transform:translateY(0);
  }

  55%{
    opacity:.65;
    filter:blur(2px);
  }

  100%{
    opacity:0;
    filter:blur(11px);

    transform:
      translateY(-26px)
      scale(.985);
  }
}

@keyframes featherDrift{
  0%{
    top:-290px;
    opacity:0;

    transform:
      translateX(-50%)
      rotate(-28deg)
      scale(.72);
  }

  8%{
    opacity:1;
  }

  24%{
    transform:
      translateX(-18%)
      rotate(17deg)
      scale(.88);
  }

  45%{
    transform:
      translateX(-76%)
      rotate(-14deg)
      scale(.94);
  }

  67%{
    transform:
      translateX(-28%)
      rotate(12deg)
      scale(.98);
  }

  84%{
    transform:
      translateX(-67%)
      rotate(-8deg)
      scale(1);
  }

  100%{
    top:20vh;
    opacity:.96;

    transform:
      translateX(-50%)
      rotate(6deg)
      scale(1);
  }
}

@keyframes featherAccept{
  0%{
    top:20vh;
    opacity:.96;

    transform:
      translateX(-50%)
      rotate(6deg)
      scale(1);
  }

  38%{
    opacity:1;

    transform:
      translateX(-50%)
      rotate(-4deg)
      scale(1.15);

    filter:
      drop-shadow(0 0 18px #e8ffec)
      drop-shadow(
        0 0 50px rgba(124,255,137,.95)
      );
  }

  100%{
    top:-300px;
    opacity:0;

    transform:
      translateX(-50%)
      rotate(30deg)
      scale(.58);
  }
}

@keyframes eyesAppear{
  0%{
    opacity:0;
  }

  18%{
    opacity:.85;
  }

  70%{
    opacity:.85;
  }

  100%{
    opacity:0;
  }
}

@keyframes eyeBlink{
  0%,100%{
    transform:scaleY(1);
  }

  50%{
    transform:scaleY(.06);
  }
}

@keyframes mistMoveOne{
  from{
    transform:translateX(0);
  }

  to{
    transform:
      translateX(52vw)
      scale(1.12);
  }
}

@keyframes mistMoveTwo{
  from{
    transform:
      translateX(0)
      scale(1.05);
  }

  to{
    transform:
      translateX(-54vw)
      scale(.92);
  }
}

@keyframes mistMoveThree{
  from{
    transform:translateX(-18vw);
  }

  to{
    transform:translateX(20vw);
  }
}

@keyframes mistSymbolForm{
  0%{
    opacity:0;
    filter:blur(16px);

    transform:
      translateX(-50%)
      scale(.55);
  }

  38%{
    opacity:.58;
    filter:blur(2px);

    transform:
      translateX(-50%)
      scale(1);
  }

  72%{
    opacity:.42;
  }

  100%{
    opacity:0;
    filter:blur(13px);

    transform:
      translateX(-50%)
      scale(1.2);
  }
}

@keyframes hawkShadowPass{
  0%{
    left:-45vw;
    opacity:0;

    transform:
      translateY(20px)
      scale(.75)
      rotate(-2deg);
  }

  12%{
    opacity:.62;
  }

  50%{
    opacity:.4;
  }

  88%{
    opacity:.28;
  }

  100%{
    left:115vw;
    opacity:0;

    transform:
      translateY(-18px)
      scale(1.05)
      rotate(3deg);
  }
}

@keyframes crackReveal{
  0%{
    opacity:0;
    transform:scale(.9);
  }

  35%{
    opacity:.8;
    transform:scale(1.02);
  }

  100%{
    opacity:.48;
    transform:scale(1);
  }
}

@keyframes glitch{
  0%{
    transform:translate(0);
  }

  33%{
    transform:translate(1px,-1px);
  }

  66%{
    transform:translate(-1px,1px);
  }

  100%{
    transform:translate(0);
  }
}

@keyframes flicker{
  0%,100%{
    opacity:1;
  }

  35%{
    opacity:.72;
  }

  60%{
    opacity:.9;
  }
}

@media(max-width:600px){
  #page{
    width:98vw;
    padding:16px 12px 170px;
  }

  h1{
    font-size:36px;
  }

  #output{
    min-height:285px;
    font-size:19px;
  }

  #watchingEyes{
    top:12%;
  }

  #feather{
    width:105px;
    height:245px;
  }

  #mirrorCrack{
    width:130px;
    height:190px;
    right:1vw;
    top:12vh;
  }

  #hawkShadow{
    top:18%;
    min-width:230px;
    height:140px;
  }
}

@media(prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

/* ---------- PARTICLES ---------- */

const canvas =
  document.getElementById("particleCanvas");

const context =
  canvas.getContext("2d");

let particles = [];

function resizeCanvas(){
  const ratio =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    Math.floor(
      window.innerWidth * ratio
    );

  canvas.height =
    Math.floor(
      window.innerHeight * ratio
    );

  canvas.style.width =
    window.innerWidth + "px";

  canvas.style.height =
    window.innerHeight + "px";

  context.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );
}

function createParticle(){
  return{
    x:
      Math.random() *
      window.innerWidth,

    y:
      window.innerHeight +
      Math.random() * 80,

    radius:
      .6 + Math.random() * 1.8,

    speed:
      .15 + Math.random() * .55,

    drift:
      (Math.random() - .5) * .35,

    alpha:
      .15 + Math.random() * .55,

    pulse:
      Math.random() * Math.PI * 2,

    targetChance:
      Math.random() < .08
  };
}

function resetParticle(particle){
  Object.assign(
    particle,
    createParticle()
  );
}

function animateParticles(){
  context.clearRect(
    0,
    0,
    window.innerWidth,
    window.innerHeight
  );

  const box =
    wish.getBoundingClientRect();

  for(const particle of particles){
    particle.pulse += .025;
    particle.y -= particle.speed;

    particle.x +=
      particle.drift +
      Math.sin(particle.pulse) * .08;

    if(
      particle.targetChance &&
      !wishArea.classList.contains("hidden") &&
      box.width > 0
    ){
      const targetX =
        box.left + box.width / 2;

      const targetY =
        box.top + box.height / 2;

      particle.x +=
        (targetX - particle.x) * .0007;

      particle.y +=
        (targetY - particle.y) * .0003;
    }

    if(
      particle.y < -20 ||
      particle.x < -30 ||
      particle.x >
        window.innerWidth + 30
    ){
      resetParticle(particle);
    }

    const glow =
      particle.alpha *
      (
        .7 +
        .3 * Math.sin(particle.pulse)
      );

    context.beginPath();

    context.arc(
      particle.x,
      particle.y,
      particle.radius,
      0,
      Math.PI * 2
    );

    context.fillStyle =
      `rgba(124,255,137,${glow})`;

    context.shadowBlur = 8;

    context.shadowColor =
      "rgba(124,255,137,.65)";

    context.fill();
  }

  context.shadowBlur = 0;

  requestAnimationFrame(
    animateParticles
  );
}

function startParticles(){
  resizeCanvas();

  const count =
    Math.min(
      90,
      Math.max(
        38,
        Math.floor(
          window.innerWidth / 14
        )
      )
    );

  particles =
    Array.from(
      {length:count},
      createParticle
    );

  animateParticles();
}

window.addEventListener(

/* ---------- LOCAL MEMORY ---------- */

const MEMORY_KEY =
  "oneWishSeenPhrasesV9";

function loadMemory(){
  try{
    return JSON.parse(
      localStorage.getItem(MEMORY_KEY)
    ) || {};

  }catch{
    return {};
  }
}

function saveMemory(memory){
  try{
    localStorage.setItem(
      MEMORY_KEY,
      JSON.stringify(memory)
    );

  }catch{}
}

function randomUnseen(
  category,
  list
){
  if(
    !Array.isArray(list) ||
    list.length === 0
  ){
    return "";
  }

  const memory = loadMemory();

  const seen =
    Array.isArray(memory[category])
      ? memory[category]
      : [];

  let available =
    list
      .map((item,index) => ({
        item,
        index
      }))
      .filter(entry =>
        !seen.includes(entry.index)
      );

  if(available.length === 0){
    memory[category] = [];

    available =
      list.map((item,index) => ({
        item,
        index
      }));
  }

  const chosen =
    randomFrom(available);

  memory[category] = [
    ...(memory[category] || []),
    chosen.index
  ];

  saveMemory(memory);

  return chosen.item;
}

const generalThemeLines = [
  "The Feather now carries the shape of your desire.",
  "Your intention has entered the waiting place.",
  "The silence has understood enough.",
  "The path has accepted what you could not leave unspoken."
];

function wishTheme(text){
  const lower =
    text.toLowerCase();

  for(const theme of wishThemes){
    if(
      theme.words.some(word =>
        lower.includes(word)
      )
    ){
      return randomFrom(theme.lines);
    }
  }

  return randomFrom(
    generalThemeLines
  );
}

/* ---------- MESSAGE BUILDERS ---------- */

function makeJourneyCode(){
  const letters =
    "ABCDEFGHJKLMNPQRSTUVWXYZ";

  const words = [
    "HAWK",
    "FEATHER",
    "MIRROR",
    "INK",
    "DOOR",
    "SHADOW",
    "ECHO",
    "PATH",
    "SEAL",
    "MOON"
  ];

  const letter =
    letters[
      Math.floor(
        Math.random() *
        letters.length
      )
    ];

  const number =
    Math.floor(
      Math.random() * 900
    ) + 100;

  return (
    `${letter}${number}-${randomFrom(words)}`
  );
}

function firstWishMessage(wishText){
  return [
    randomUnseen(
      "firstOpenings",
      firstOpenings
    ),

    wishTheme(wishText),

    randomUnseen(
      "firstHopeful",
      firstHopeful
    ),

    randomUnseen(
      "firstMystery",
      firstMystery
    ),

    randomUnseen(
      "firstClosings",
      firstClosings
    )
  ].join("\n");
}

function secondWishMessage(wishText){
  return [
    randomUnseen(
      "secondOpenings",
      secondOpenings
    ),

    wishTheme(wishText),

    randomUnseen(
      "secondWarnings",
      secondWarnings
    ),

    randomUnseen(
      "secondMystery",
      secondMystery
    ),

    randomUnseen(
      "secondClosings",

}

async function displayProcessing(){
  await typeText(
    randomUnseen(

  await typeText(

}

/* ---------- START ---------- */

async function start(){
  startParticles();
  launchFeather();
  scheduleEyes();
  scheduleHawkShadow();
  scheduleMistSymbol();

  await sleep(650);

  const selectedIntro =
    randomUnseen(
      "introMessages",
      introMessages
    );

  for(const line of selectedIntro){
    await typeText(
      line + "\n"
    );

    await sleep(270);
  }

  cursor.classList.add("hidden");

  wishArea.classList.remove("hidden");

  wish.focus();
}

/* ---------- SEAL WISH ---------- */

seal.addEventListener(
  "click",
  async () => {

    if(processing){
      return;
    }

    const wishText =
      wish.value.trim();

    if(!wishText){
      wish.placeholder =
        wishNumber === 1
          ? "A wish must first be written..."
          : "Your second wish must first be written...";

      wish.focus();

      return;
    }

    processing = true;

    seal.disabled = true;
    wish.disabled = true;

    const wishSaved =
      await saveWish(wishText);

    if(!wishSaved){
      processing = false;

      seal.disabled = false;
      wish.disabled = false;

      wish.placeholder =
        "The connection could not receive your wish. Please try again...";

      wish.focus();

      return;
    }

    acceptWishWithFeather();

    await dissolveInk();

    wishArea.classList.add("hidden");

    secondWishButton.classList.add(
      "hidden"
    );

    clearOutput();
    subtleFlicker();

    await displayProcessing();

    occasionalGlitch(.22);

    if(wishNumber === 1){
      await typeText(
        "\n" +
        firstWishMessage(wishText) +
        "\n",
        34
      );

      await sleep(650);

      const rare =
        rareEvent();

      if(rare){
        output.classList.add("rare");

        await typeText(
          "\n" + rare + "\n",
          42
        );
      }

      cursor.classList.add("hidden");

      secondWishButton.textContent =
        randomUnseen(
          "secondWishButtons",
          secondWishButtons
        );

      secondWishButton.disabled = false;

      secondWishButton.classList.remove(
        "hidden"
      );

      processing = false;

      return;
    }

    await typeText(
      "\n" +
      secondWishMessage(wishText) +
      "\n",
      34
    );

    await sleep(700);

    const rare =
      rareEvent();

    if(rare){
      output.classList.add("rare");

      await typeText(
        "\n" + rare + "\n",
        42
      );

      await sleep(500);
    }

    revealMirrorCrack();

    const finalHeading =
      randomUnseen(
        "finalHeadings",
        finalHeadings
      );

    const challenge =
      randomUnseen(
        "challenges",
        challenges
      );

    const finalEnding =
      randomUnseen(
        "finalEndings",
        finalEndings
      );

    await typeText(
      "\n" +
      finalHeading +
      "\n\n" +
      challenge +
      "\n\n" +
      "Journey Feather Code: " +
      makeJourneyCode() +
      "\n\n" +
      finalEnding.join("\n") +
      "\n",
      38
    );

    cursor.classList.add("hidden");

    wishArea.classList.add("hidden");

    secondWishButton.classList.add(
      "hidden"
    );

    processing = false;
  }
);

/* ---------- SECOND WISH ---------- */

secondWishButton.addEventListener(
  "click",
  async () => {

    if(
      processing ||
      wishNumber !== 1
    ){
      return;
    }

    processing = true;
    wishNumber = 2;

    secondWishButton.disabled = true;

    secondWishButton.classList.add(
      "hidden"
    );

    clearOutput();
    subtleFlicker();

    await typeText(
      randomUnseen(
        "returnOpenings",
        returnOpenings
      ) +
      "\n",
      46
    );

    await sleep(550);

    await typeText(
      "\n" +
      randomUnseen(
        "greedWarnings",
        greedWarnings
      ) +
      "\n",
      38
    );

    await sleep(750);

    await typeText(
      "\n" +
      randomUnseen(
        "finalWishNotices",
        finalWishNotices
      ) +
      "\n",
      44
    );

    await sleep(600);

    cursor.classList.add("hidden");

    wish.value = "";
    wish.disabled = false;

    wish.placeholder =
      "Write your second and final wish here...";

    seal.disabled = false;

    seal.textContent =
      "SEAL MY FINAL WISH";

    wishArea.classList.remove("hidden");

    /*
      This selects an entirely new feather.
      It cannot repeat the previous design.
    */
    launchFeather();

    processing = false;

    wish.focus();
  }
);

start();
