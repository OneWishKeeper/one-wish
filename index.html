:root{
  --green:#7cff89;
  --dim:#4ca85a;
  --border:#173a1c;
  --panel:rgba(2,7,2,.88);
  --sigil-background:none;
}

*{box-sizing:border-box}

html,body{min-height:100%}

body{
  margin:0;
  min-height:100vh;
  background:#000;
  color:var(--green);
  font-family:"Courier New",monospace;
  display:grid;
  place-items:center;
  padding:24px;
  overflow-x:hidden;
  position:relative;
  isolation:isolate;
}

body::before{
  content:"";
  position:fixed;
  inset:-4%;
  z-index:-2;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(0,0,0,.08),rgba(0,0,0,.22)),
    var(--sigil-background);
  background-size:112% 112%;
  background-position:center;
  background-repeat:no-repeat;
  opacity:1;
  transform:scale(1.06);
  filter:
    brightness(1.45)
    contrast(1.18)
    drop-shadow(0 0 14px rgba(124,255,137,.48));
  animation:sigilBreathe 18s ease-in-out infinite;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:30;
  pointer-events:none;
  opacity:.05;
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 3px,
      rgba(124,255,137,.18) 4px
    );
  animation:staticShift 8s steps(2,end) infinite;
}

main{
  width:min(1000px,94vw);
  min-height:360px;
  padding:clamp(24px,4vw,44px);
  border:none;
  box-shadow:none;
  background:transparent;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  position:relative;
  z-index:1;
}

h1{
  text-align:center;
  font-size:clamp(34px,5vw,58px);
  letter-spacing:.15em;
  text-shadow:
    0 0 3px #000,
    0 0 7px #000,
    0 0 14px rgba(124,255,137,.72),
    0 0 26px rgba(124,255,137,.34);
}

#output{
  white-space:pre-wrap;
  line-height:1.68;
  min-height:240px;
  font-size:clamp(18px,2.2vw,24px);
  font-weight:700;
  text-shadow:
    0 0 2px #000,
    0 0 5px #000,
    0 0 10px rgba(124,255,137,.55),
    0 0 18px rgba(124,255,137,.24);
}

#cursor{
  display:inline-block;
  width:9px;
  height:1.05em;
  margin-left:3px;
  vertical-align:-2px;
  background:var(--green);
  animation:blink .85s steps(1,end) infinite;
}

textarea{
  width:100%;
  min-height:120px;
  resize:vertical;
  background:rgba(0,0,0,.72);
  color:var(--green);
  border:1px solid rgba(124,255,137,.65);
  padding:14px;
  font:inherit;
  box-shadow:
    0 0 16px rgba(124,255,137,.16),
    inset 0 0 18px rgba(0,0,0,.72);
}

textarea:focus{
  outline:none;
  box-shadow:0 0 14px rgba(124,255,137,.18);
}

button{
  display:block;
  width:100%;
  margin-top:14px;
  padding:14px;
  background:rgba(0,0,0,.62);
  color:var(--green);
  border:1px solid var(--green);
  font:700 16px "Courier New",monospace;
  text-align:center;
  line-height:1.4;
  cursor:pointer;
  text-shadow:
    0 0 3px #000,
    0 0 8px rgba(124,255,137,.48);
  box-shadow:0 0 15px rgba(124,255,137,.12);
}

button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}

.notice{
  font-size:12px;
  line-height:1.5;
  color:var(--dim);
}

.hidden{display:none!important}
.glitch{animation:glitch .18s steps(2,end) 3}
.flicker{animation:flicker .15s linear 2}

.rare{
  border-color:#7cff89;
  box-shadow:0 0 22px rgba(124,255,137,.25);
}

@keyframes blink{
  0%,45%{opacity:1}
  46%,100%{opacity:0}
}

@keyframes staticShift{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(2px)}
}

@keyframes glitch{
  0%{transform:translate(0)}
  33%{transform:translate(1px,-1px)}
  66%{transform:translate(-1px,1px)}
  100%{transform:translate(0)}
}

@keyframes flicker{
  0%,100%{opacity:1}
  35%{opacity:.72}
  60%{opacity:.9}
}

@keyframes sigilBreathe{
  0%,100%{
    opacity:.88;
    transform:scale(1.06) rotate(0deg);
  }
  50%{
    opacity:1;
    transform:scale(1.10) rotate(.45deg);
  }
}

@media (max-width:600px){
  body{padding:10px}
  main{
    width:96vw;
    min-height:420px;

  }
  h1{

  }
  #output{
    min-height:280px;
    font-size:19px;
  }
}
</style>

  }
}

function shuffleList(list){
  const shuffled = [...list];
  for(let i=shuffled.length-1;i>0;i--){
    const randomIndex = Math.floor(Math.random()*(i+1));
    [shuffled[i],shuffled[randomIndex]]=[shuffled[randomIndex],shuffled[i]];
  }
  return shuffled;
}

function forgePhrases(starters,middles,endings,count=250){
  const phrases=[];
  for(const starter of starters){
    for(const middle of middles){
      for(const ending of endings){
        const phrase=`${starter} ${middle}${ending}`.replace(/\s+/g," ").trim();
        if(!phrases.includes(phrase)) phrases.push(phrase);
      }
    }
  }
  return shuffleList(phrases).slice(0,count);
}

function forgeLines(firstLines,secondLines,thirdLines,count=250){
  const phrases=[];
  for(const first of firstLines){
    for(const second of secondLines){
      for(const third of thirdLines){
        const phrase=`${first}\n${second}\n${third}`;
        if(!phrases.includes(phrase)) phrases.push(phrase);
      }
    }
  }
  return shuffleList(phrases).slice(0,count);
}

function saveMemory(memory){

function randomUnseen(category,list){
  if(!Array.isArray(list) || list.length===0) return "";

  const memory=loadMemory();
  const seen=Array.isArray(memory[category]) ? memory[category] : [];

  let available=list
    .map((item,index)=>({item,index}))
    .filter(entry=>!seen.includes(entry.index));

  if(available.length===0){
    memory[category]=[];
    available=list.map((item,index)=>({item,index}));
  }

  const chosen=randomFrom(available);
  memory[category]=[...(memory[category]||[]),chosen.index];
  saveMemory(memory);
  return chosen.item;
}

function wishTheme(text){
  const lower=text.toLowerCase();

  for(const theme of wishThemes){
    if(theme.words.some(word=>lower.includes(word))){
      return randomUnseen("theme_"+theme.key,theme.lines);
    }
  }

  return randomUnseen("generalThemes",generalThemeLines);
}

/* ---------------- MESSAGE BUILDERS ---------------- */

function makeJourneyCode(){
  const letters="ABCDEFGHJKLMNPQRSTUVWXYZ";
  const words=["HAWK","FEATHER","MIRROR","INK","DOOR","SHADOW","ECHO","PATH","SEAL","MOON","LEDGER","THRESHOLD"];

  const firstLetter=letters[Math.floor(Math.random()*letters.length)];
  const number=String(Math.floor(Math.random()*900)+100);
  return `${firstLetter}${number}-${randomFrom(words)}`;
}

function firstWishMessage(wishText){
  const opening=randomUnseen("firstOpenings",firstOpenings);
  const theme=wishTheme(wishText);
  const hopeful=randomUnseen("firstHopeful",firstHopeful);
  const mystery=randomUnseen("firstMystery",firstMystery);
  const closing=randomUnseen("firstClosings",firstClosings);

  const templates=[
    [opening,theme,hopeful,mystery,closing],
    [opening,hopeful,"",theme,closing,mystery],
    [theme,"",opening,mystery,"",hopeful,closing],
    [opening,"",mystery,theme,hopeful,"",closing],
    [hopeful,opening,"",theme,mystery,closing],
    [opening,theme,"",closing,mystery,hopeful]
  ];

  return randomFrom(templates).join("\n");
}

function secondWishMessage(wishText){
  const opening=randomUnseen("secondOpenings",secondOpenings);
  const theme=wishTheme(wishText);

    [theme,opening,"",warning,closing,mystery],
    [opening,warning,"",mystery,theme,closing],

}

  const receiving=randomUnseen("receivingMessages",receivingMessages);

  await typeText("\n"+sealed+"\n",54);
  await sleep(700);
}

async function start(){
  await sleep(650);

  const selectedIntro=randomUnseen("introMessages",introMessages);

  for(const line of selectedIntro){
    await typeText(line+"\n");
    await sleep(270);
  }

  cursor.classList.add("hidden");
  wishArea.classList.remove("hidden");
  wish.focus();
}

/* ---------------- FIRST AND SECOND WISH ---------------- */

seal.addEventListener("click",async()=>{
  if(processing) return;

  const wishText=wish.value.trim();

  if(!wishText){
    wish.placeholder=wishNumber===1
      ? "A wish must first be written..."
      : "Your second wish must first be written...";
    wish.focus();
    return;
  }

  processing=true;
  seal.disabled=true;
  wish.disabled=true;

  const wishSaved=await saveWish(wishText);

  if(!wishSaved){
    processing=false;
    seal.disabled=false;
    wish.disabled=false;
    wish.placeholder="The connection could not receive your wish. Please try again...";
    wish.focus();
    return;
  }

  wishArea.classList.add("hidden");
  secondWishButton.classList.add("hidden");

  clearOutput();
  subtleFlicker();
  await displayProcessing();
  occasionalGlitch(.22);

  if(wishNumber===1){
    await typeText("\n"+firstWishMessage(wishText)+"\n",34);
    await sleep(650);

    const rare=rareEvent();
    if(rare){
      panel.classList.add("rare");
      await typeText("\n"+rare+"\n",42);
    }

    cursor.classList.add("hidden");
    secondWishButton.textContent=randomUnseen("secondWishButtons",secondWishButtons);
    secondWishButton.disabled=false;
    secondWishButton.classList.remove("hidden");
    processing=false;
    return;
  }

  await typeText("\n"+secondWishMessage(wishText)+"\n",34);
  await sleep(700);

  const rare=rareEvent();
  if(rare){
    panel.classList.add("rare");
    await typeText("\n"+rare+"\n",42);
    await sleep(500);
  }

  const challenge=randomUnseen("challenges",challenges);
  const finalHeading=randomUnseen("finalHeadings",finalHeadings);
  const finalEnding=randomUnseen("finalEndings",finalEndings);
  const journeyCode=makeJourneyCode();

  await typeText(
    "\n"+finalHeading+"\n\n"+
    challenge+"\n\n"+
    "Journey Feather Code: "+journeyCode+"\n\n"+
    finalEnding.join("\n")+"\n",
    38
  );

  cursor.classList.add("hidden");
  secondWishButton.classList.add("hidden");
  wishArea.classList.add("hidden");
  processing=false;
});

  processing=true;
  wishNumber=2;

  secondWishButton.disabled=true;
  secondWishButton.classList.add("hidden");

  await typeText(randomUnseen("returnOpenings",returnOpenings)+"\n",46);

  await sleep(750);

  cursor.classList.add("hidden");
  wish.value="";
  wish.disabled=false;
  wish.placeholder="Write your second and final wish here...";
  seal.disabled=false;
  seal.textContent="SEAL MY FINAL WISH";
  wishArea.classList.remove("hidden");

});
